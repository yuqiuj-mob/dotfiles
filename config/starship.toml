# Starship prompt configuration
# Uses 256-color codes for tmux compatibility with good aesthetics

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$env_var\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[>](bold 214)"
error_symbol = "[>](bold 167)"

[username]
show_always = true
format = "[$user]($style)"
style_user = "bold 208"
style_root = "bold 160"

[hostname]
ssh_only = false
format = "[@$hostname]($style) "
style = "bold 208"

[directory]
truncation_length = 4
truncation_symbol = ".../"
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold 215"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = ""
style = "bold 168"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold 203"

[env_var.P4CLIENT]
symbol = "p4:"
variable = "P4CLIENT"
format = "[$symbol$env_value]($style) "
style = "bold 221"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "245"

[package]
disabled = true

[python]
disabled = true

[golang]
disabled = true

[nodejs]
disabled = true

[rust]
disabled = true

[java]
disabled = true
