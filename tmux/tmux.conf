# ============================================================================
#  tmux.conf  —  Zellij-like layout, Tokyo Night theme
#  Panels: tabs on top + a context keyhint ribbon below them.
#  Keeps your original keybinds (M-m prefix, emacs mode, pane nav).
#  Portable to tmux 3.2+  (offline old machine included).
# ----------------------------------------------------------------------------
#  Palette (Tokyo Night):
#    bg      #1a1b26     ribbon bg #16161e
#    dim     #565f89     border    #414868
#    blue    #7aa2f7  (active/accent)   purple #bb9af7
#    green   #9ece6a     yellow    #e0af68     red #f7768e
# ============================================================================

# ---- core -----------------------------------------------------------------
# screen-256color (not tmux-256color) because older machines' system ncurses
# often lacks the tmux-256color entry -> "Terminal type ... is not defined"
# for anything launched inside tmux. True-color still works via the RGB
# feature below, which is independent of the terminfo name.
set -g default-terminal "screen-256color"
set -ag terminal-features ",xterm-256color:RGB"   # 24-bit color (truecolor)
set -ag terminal-features ",screen-256color:RGB"
set -g mode-keys   emacs
set -g status-keys emacs
set -g history-limit 99999
set -sg escape-time 10          # snappy Meta-key handling (was 500ms default)
set -g  focus-events on
set -g  mouse on                # click tabs/panes, drag borders, scroll to copy
set -g  base-index 1            # windows (tabs) start at 1
setw -g pane-base-index 1
set -g  renumber-windows on     # keep tab numbers gapless
set -g  display-time 1500
set -g  set-clipboard on        # OSC52 clipboard (works over SSH, no xclip)
                                # ^ if the OLD machine crashes on copy, first
                                #   thing to try:  set -s set-clipboard off

# ---- prefix + your original keybinds --------------------------------------
unbind C-b
unbind [
set -g prefix M-m
bind M-m copy-mode

bind-key -T prefix M-f select-pane -R
bind-key -T prefix M-b select-pane -L
bind-key -T prefix M-n select-pane -D
bind-key -T prefix M-p select-pane -U

# ---- added productivity keybinds (all under M-m prefix) -------------------
bind r source-file ~/.tmux.conf \; display "  tmux.conf reloaded"
bind c new-window      -c "#{pane_current_path}"      # new tab, same dir
bind | split-window -h -c "#{pane_current_path}"      # vsplit, same dir
bind - split-window -v -c "#{pane_current_path}"      # hsplit, same dir
bind s choose-tree -Zs                                # session/window tree
bind BSpace last-window                               # jump to previous tab
# bind z resize-pane -Z                                 # zoom toggle (also 'z')
bind e setw pane-border-status                        # toggle pane frames off/on
bind M-o display-popup -E -w 60% -h 60% "~/.config/tmux/tmux-sessionizer"  # fuzzy project jump
bind o select-pane -t :.+         # M-m Tab = next pane
bind Tab select-pane -t :.+       # M-m Tab = next pane
bind BTab select-pane -t :.-      # M-m Shift-Tab = previous pane
# copy mode: C-M-Space multi-tap select: word -> WORD (whitespace-delimited, e.g. a path) -> line
bind -T copy-mode C-M-Space if -F '#{selection_present}' \
    "if -F '#{==:#{@selw},1}' \
        'send -X previous-space ; send -X begin-selection ; send -X next-space-end ; set -p @selw 2' \
        'send -X select-line ; set -p @selw 0'" \
    'send -X select-word ; set -p @selw 1'
#
# floating scratch terminal (Zellij-style), persists across toggles ---------
# M-m f is a TOGGLE: the popup runs a nested tmux client attached to the
# "scratch" session, so when the key is pressed *inside* the float the current
# session is "scratch" -> detach-client closes the popup. Outside, it opens.
# (This is why nesting a float-in-a-float can't happen — no M-m d needed.)
# NOTE: the -T (title) flag only exists in tmux >= 3.3, so guard it — on 3.2a
# passing -T errors out and the whole bind silently fails to register.
%if "#{>=:#{version},3.3}"
bind f if -F '#{==:#{session_name},scratch}' 'detach-client' 'display-popup -E -w 82% -h 78% -T " scratch " "tmux new-session -A -s scratch"'
%else
bind f if -F '#{==:#{session_name},scratch}' 'detach-client' 'display-popup -E -w 82% -h 78% "tmux new-session -A -s scratch"'
%endif

# ============================================================================
#  VISUALS  —  Zellij-like tab bar + keyhint ribbon
# ============================================================================
set -g status on                # single status line (the window tab bar)
set -g status-position top
# Clear any lingering per-line format overrides from an earlier 2-line layout
# so the default tab-bar template renders. NOTE: unset the WHOLE array here —
# `set -gu status-format[0]` does NOT restore the default, it BLANKS the bar.
set -gu status-format
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#565f89"
set -g status-left-length 40
set -g status-right-length 60

# session badge (left)
set -g status-left "#[fg=#1a1b26,bg=#bb9af7,bold] #S #[fg=#bb9af7,bg=#1a1b26,nobold] "

# tabs (windows)
set -g window-status-separator ""
set -g window-status-format         "#[fg=#565f89] #I #W #{?window_flags,#F,} "
set -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7,bold] #I #W #{?window_flags,#F,} #[default]"
set -g window-status-activity-style "fg=#e0af68"

# right side: subtle prefix/copy indicator (only when active) + zoom + clock
set -g status-right "#{?client_prefix,#[fg=#1a1b26#,bg=#7aa2f7#,bold] PREFIX #[default] ,}#{?pane_in_mode,#[fg=#1a1b26#,bg=#9ece6a#,bold] COPY #[default] ,}#[fg=#e0af68]#{?window_zoomed_flag, ZOOM ,}#[fg=#565f89] %a %d %b  #[fg=#7aa2f7]%H:%M "

# (Keyhint ribbon removed — tmux has a single status region, so the tab bar
#  gets the top line. A compact prefix/copy indicator lives in status-right.)

# ---- pane frames (Zellij-like borders with titles) ------------------------
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-format " #{?pane_active,#[fg=#7aa2f7#,bold],#[fg=#565f89]}#P #{pane_current_command} "
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-style "fg=#414868"

# mode (copy / menu) + message styling
set -g mode-style    "bg=#283457,fg=#c0caf5"
set -g message-style "bg=#7aa2f7,fg=#1a1b26,bold"
set -g message-command-style "bg=#16161e,fg=#7aa2f7"

# menus / popups (popup-border-* are tmux >= 3.4 only, so guard them)
%if "#{>=:#{version},3.4}"
set -g popup-border-lines rounded
set -g popup-border-style "fg=#7aa2f7"
%endif

# ============================================================================
#  OPTIONAL: plugins via TPM  (only on machines with git + internet)
#  Install once:
#    git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#  Then uncomment below, reload (M-m r), and press  M-m I  to install.
# ----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions (M-m C-s / C-r)
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save every 15 min + restore on start
# set -g @plugin 'sainnhe/tmux-fzf'              # fuzzy everything
set -g @continuum-restore 'on'
run '~/.tmux/plugins/tpm/tpm'      # keep this line LAST
